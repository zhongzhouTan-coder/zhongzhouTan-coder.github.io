name: Docs Lint

on:
  push:
    paths:
      - "docs/**"
      - "derived/**"
      - "logs/**"
      - "raw/**"
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "kb-categories.json"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".ruby-version"
      - "AGENTS.md"
      - ".github/instructions/**"
      - ".agents/skills/**"
      - ".codex/**"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "docs/**"
      - "derived/**"
      - "logs/**"
      - "raw/**"
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "kb-categories.json"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".ruby-version"
      - "AGENTS.md"
      - ".github/instructions/**"
      - ".agents/skills/**"
      - ".codex/**"
      - ".github/workflows/docs-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests and docs lint
        run: |
          test_status=0
          lint_status=0
          npm test > docs-lint-report.txt 2>&1 || test_status=$?
          ./scripts/lint-docs.sh >> docs-lint-report.txt 2>&1 || lint_status=$?
          cat docs-lint-report.txt
          if (( test_status != 0 || lint_status != 0 )); then
            exit 1
          fi

      - name: Publish docs lint summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          {
            echo "## Docs Lint Report"
            echo
            if [[ ! -f docs-lint-report.txt ]]; then
              echo "Validation did not start; inspect the preceding setup step."
            elif [[ "${{ job.status }}" == "success" ]]; then
              echo "No docs lint findings."
            else
              echo "Docs lint reported findings. See details below."
              echo
              echo '```text'
              cat docs-lint-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs lint artifact
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-lint-report
          path: docs-lint-report.txt
          if-no-files-found: warn
