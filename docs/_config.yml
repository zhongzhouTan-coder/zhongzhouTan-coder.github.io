title: Knowledge Base
description: AI-maintained personal knowledge base by zhongzhouTan
url: "https://zhongzhouTan-coder.github.io"
baseurl: ""

theme: minima

# GitHub Pages settings
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

# Exclude from Jekyll build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor/

defaults:
  - scope:
      path: ""
    values:
      layout: default
