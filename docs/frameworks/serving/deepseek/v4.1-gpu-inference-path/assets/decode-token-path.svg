<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1540 680" role="img" aria-labelledby="title desc">
  <ns0:title id="title">One DeepSeek V4.1 GPU decode token through the FlashMLA branch</ns0:title>
  <ns0:desc id="desc">Scheduler output enters the GPU runner and V4.1 decoder. Each attention layer writes local SWA state; configured KV source layers publish compressed KV and index K; configured index source layers update shared top-k positions. FlashMLA reads those inputs, then the decoder and GPU sampler produce a token ID returned in AsyncOutput.</ns0:desc>
  <ns0:rect width="1540" height="680" fill="#ffffff" />
  <ns0:text x="50" y="42" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#1f2d3d">One decode token: cache ownership and handoff</ns0:text>
  <ns0:text x="50" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#536273">Text-only · non-speculative · compressed layer · index refresh · FlashMLA branch</ns0:text>
  <ns0:rect x="35" y="225" width="1470" height="330" rx="18" fill="#f8fafc" stroke="#c7d2df" stroke-width="2" />
  <ns0:text x="65" y="259" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#31445c">Inside one compressed-attention layer</ns0:text>
  <ns0:text x="65" y="547" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#536273">KV-source and index-source roles are independent; a layer may have both.</ns0:text>
