      <ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#55718d" />
    </ns0:marker>
    <ns0:marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#7053a3" />
