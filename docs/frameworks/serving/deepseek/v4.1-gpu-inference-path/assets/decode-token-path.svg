  <ns0:rect x="50" y="98" width="240" height="86" rx="12" fill="#e8f2ff" stroke="#2c63a1" stroke-width="2.5" />
  <ns0:text x="68" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">SchedulerOutput</ns0:text>
  <ns0:text x="68" y="159" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">scheduled token rows</ns0:text>
  <ns0:rect x="380" y="98" width="300" height="86" rx="12" fill="#e8f2ff" stroke="#2c63a1" stroke-width="2.5" />
  <ns0:text x="398" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">GPUModelRunner</ns0:text>
  <ns0:text x="398" y="159" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">InputBatch, slots, metadata</ns0:text>
  <ns0:rect x="770" y="98" width="335" height="86" rx="12" fill="#efeaff" stroke="#7053a3" stroke-width="2.5" />
  <ns0:text x="788" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">V4.1 decoder layer</ns0:text>
  <ns0:text x="788" y="159" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">attention input + position</ns0:text>
  <ns0:rect x="65" y="278" width="430" height="70" rx="12" fill="#fff3df" stroke="#a66716" stroke-width="2.5" />
  <ns0:text x="83" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Every attention layer</ns0:text>
  <ns0:text x="83" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">Q + local SWA KV / cache</ns0:text>
  <ns0:rect x="65" y="365" width="430" height="70" rx="12" fill="#fff3df" stroke="#a66716" stroke-width="2.5" />
  <ns0:text x="83" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Configured KV source</ns0:text>
  <ns0:text x="83" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">main KV; index K if also index source</ns0:text>
  <ns0:rect x="65" y="452" width="430" height="70" rx="12" fill="#fff3df" stroke="#a66716" stroke-width="2.5" />
  <ns0:text x="83" y="479" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Configured index source</ns0:text>
  <ns0:text x="83" y="503" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">index Q + index K → shared top-k positions</ns0:text>
  <ns0:rect x="650" y="358" width="300" height="106" rx="12" fill="#e5f5f0" stroke="#287462" stroke-width="2.5" />
  <ns0:text x="668" y="391" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">FlashMLA sparse decode</ns0:text>
  <ns0:text x="668" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">Q + local SWA + selected</ns0:text>
  <ns0:text x="668" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">compressed main KV</ns0:text>
  <ns0:rect x="1080" y="358" width="365" height="106" rx="12" fill="#e5f5f0" stroke="#287462" stroke-width="2.5" />
  <ns0:text x="1098" y="391" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Layer output</ns0:text>
  <ns0:text x="1098" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">projection → mHC → MoE</ns0:text>
  <ns0:text x="1098" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">repeat through decoder stack</ns0:text>
  <ns0:rect x="650" y="585" width="330" height="66" rx="12" fill="#e8f2ff" stroke="#2c63a1" stroke-width="2.5" />
  <ns0:text x="668" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Logits + GPU sampler</ns0:text>
  <ns0:text x="668" y="634" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">sampled token ID</ns0:text>
  <ns0:rect x="1080" y="585" width="365" height="66" rx="12" fill="#e8f2ff" stroke="#2c63a1" stroke-width="2.5" />
  <ns0:text x="1098" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f2d3d">Worker return</ns0:text>
  <ns0:text x="1098" y="634" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#33465b">AsyncOutput / ModelRunnerOutput</ns0:text>
  <ns0:text x="50" y="669" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#536273">Synthesized from vLLM commit 02aa10539f15; arrows show data handoffs, not kernel launch order.</ns0:text>
